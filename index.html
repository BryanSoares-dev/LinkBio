<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de links</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward_ios" />
</head>
<body>

    <div class="background_shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

    <div class="waves-left">
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="line l4"></div>
        <div class="line l5"></div>
        <div class="line l6"></div>
    </div>

    <div class="waves-right">
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="line l4"></div>
        <div class="line l5"></div>
        <div class="line l6"></div>
    </div>

    <div class="container">
    <div class="container-perfil">
        <img class="eu" src="img/eu.png" alt="eu" width="170px">
        <h1>Desenvolvedor | Estudante | 17 anos | Suzano-SP</h1>
        <p>Aqui você encontra os principais link para conectar, acompanhar e falar comigo.</p>
    </div>

    <button>
    <a href="https://github.com/BryanSoares-dev">
    <section class="container-card">
        <img class="logo" src="img/logo-git.png" alt="logo-github" width="60px">
        <div class="infos-card">
            <h2>GitHub</h2>
            <p>Acesse meus projetos e contribuições</p>
        </div>
        <span class="material-symbols-outlined">arrow_forward_ios</span>
    </section>
    </a>
    </button>

    <button>
    <a href="https://linkedin.com/in/bryan-soares-dev">
    <section class="container-card">
        <img class="logo" src="img/linkedin-logo.png" alt="logo-github" width="60px">
        <div class="infos-card">
            <h2>Linkedin</h2>
            <p>Veja meu perfil profissional</p>
        </div>
        <span class="material-symbols-outlined">arrow_forward_ios</span>
    </section>
    </a>
    </button>

    <button>
    <a href="https://github.com/BryanSoares-dev">
    <section class="container-card">
        <img class="logo" src="img/whatsapp-logo.png" alt="logo-github" width="60px">
        <div class="infos-card">
            <h2>WhatsApp</h2>
            <p>Entre em contato diretamente comigo</p>
        </div>
        <span class="material-symbols-outlined">arrow_forward_ios</span>
    </section>
    </a>
    </button>

    <button>
    <a href="https://github.com/BryanSoares-dev">
    <section class="container-card">
        <img class="logo" src="img/instagram-logo.jfif" alt="logo-github" width="60px">
        <div class="infos-card">
            <h2>Instagram</h2>
            <p>Me acompanhe no instagram</p>
        </div>
        <span class="material-symbols-outlined">arrow_forward_ios</span>
    </section>
    </a>
    </button>
    </div>

    <footer>&copy Desenvolvido por Bryan Soares</footer>

</body>
</html>
